<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>防球ネット除去ツール（改良版）</title>
  <style>
    canvas { border: 1px solid #ccc; margin: 10px; }
  </style>
</head>
<body>
  <h1>防球ネット除去ツール</h1>
  <input type="file" id="upload" accept="image/*">
  <button id="process">処理</button><br>
  <canvas id="source"></canvas>
  <canvas id="result"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const sourceCanvas = document.getElementById('source');
    const resultCanvas = document.getElementById('result');
    const sourceCtx = sourceCanvas.getContext('2d');
    const resultCtx = resultCanvas.getContext('2d');
    let img;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        img = new Image();
        img.onload = () => {
          sourceCanvas.width = resultCanvas.width = img.width;
          sourceCanvas.height = resultCanvas.height = img.height;
          sourceCtx.drawImage(img, 0, 0);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('process').addEventListener('click', () => {
      if (!img) return;
      const imageData = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
      const data = imageData.data;
      const w = imageData.width;
      const h = imageData.height;
      const result = new Uint8ClampedArray(data);

      for (let y = 3; y < h - 3; y++) {
        for (let x = 3; x < w - 3; x++) {
          const i = (y * w + x) * 4;
          const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;

          const vertical = (getGray(x, y - 3) + getGray(x, y + 3)) / 2;
          const horizontal = (getGray(x - 3, y) + getGray(x + 3, y)) / 2;
          const avgAround = (vertical + horizontal) / 2;

          const contrast = Math.abs(gray - avgAround);
          if (gray < avgAround - 8 && contrast < 15) {
            const [r, g, b] = blurAround(x, y);
            result[i] = r;
            result[i + 1] = g;
            result[i + 2] = b;
          }
        }
      }

      resultCtx.putImageData(new ImageData(result, w, h), 0, 0);

      function getGray(x, y) {
        if (x < 0 || y < 0 || x >= w || y >= h) return 255;
        const i = (y * w + x) * 4;
        return (data[i] + data[i + 1] + data[i + 2]) / 3;
      }

      function blurAround(x, y) {
        let r = 0, g = 0, b = 0, count = 0;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && ny >= 0 && nx < w && ny < h) {
              const ni = (ny * w + nx) * 4;
              r += data[ni];
              g += data[ni + 1];
              b += data[ni + 2];
              count++;
            }
          }
        }
        return [r / count, g / count, b / count];
      }
    });
  </script>
</body>
</html>
